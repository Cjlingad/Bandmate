                  h("h2", {}, "Guitar example"),
                  h("p", {}, l.guitar),
                ]),
              ]),
              h("section", { class: "theory-section" }, [
                h("h2", {}, "Put it into practice"),
                h("p", {}, l.apply),
              ]),
              h("section", { class: "theory-mistake" }, [
                h("h2", {}, "Common mistake"),
                h("p", {}, l.mistake),
              ]),
              quiz,
              h("div", { class: "row theory-pagination" }, [
                h("button", {
                  class: "btn g",
                  disabled: levelIndex === 0,
                  onclick: () => lesson(levelLessons[levelIndex - 1].index),
                }, "Previous lesson"),
                h("span", { class: "sub" }, (levelIndex + 1) + " of " + levelLessons.length),
                h("button", {
                  class: "btn",
                  disabled: levelIndex === levelLessons.length - 1,
                  onclick: () => lesson(levelLessons[levelIndex + 1].index),
                }, "Next lesson"),
              ]),
            ]),
          );
        };
        menu();
        return page(
          "Music theory",
          "A structured course of " + L.length + " lessons from fundamentals to practical advanced harmony. Progress is saved to your account.",
          box,
        );
      }

      /* ============ PITCH ENGINE (autocorrelation) ============ */
      let ac, an, buf, raf, stream;
      const NN = [
        "C",
        "C#",
        "D",
        "D#",
        "E",
        "F",
        "F#",
        "G",
        "G#",
        "A",
        "A#",
        "B",
      ];
      const hz = (n) => {
        const m = n.match(/^([A-G]#?)(\d)$/);
        return 440 * 2 ** ((NN.indexOf(m[1]) + 12 * (+m[2] + 1) - 69) / 12);
      };
      const cents = (f, t) => 1200 * Math.log2(f / t);
      const nameOf = (f) => {
        const m = Math.round(69 + 12 * Math.log2(f / 440));
        return NN[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
      };
      function pitch(b, sr) {
        let c0 = 0;
        const n = b.length >> 1;
        for (let i = 0; i < n; i++) c0 += b[i] * b[i];
        if (Math.sqrt(c0 / n) < 0.012) return -1;
        const min = Math.floor(sr / 1200),
          max = Math.floor(sr / 38),
          c = new Float32Array(max + 2);
        let mx = 0;
        for (let l = min; l <= max; l++) {
          let s = 0;
          for (let i = 0; i < n; i++) s += b[i] * b[i + l];
          c[l] = s;
        }
        for (let l = min + 1; l < max; l++)
          if (c[l] > c[l - 1] && c[l] >= c[l + 1] && c[l] > mx) mx = c[l];
        if (mx < 0.5 * c0) return -1;
        for (let l = min + 1; l < max; l++)
          if (c[l] > c[l - 1] && c[l] >= c[l + 1] && c[l] >= 0.9 * mx) {
            const a = c[l - 1],
              d = c[l + 1],
              p = (a - d) / (2 * (a - 2 * c[l] + d));
            return sr / (l + (isFinite(p) ? p : 0));
          }
        return -1;
      }
      async function mic(cb, onErr) {
        try {
          ac = ac || new AudioContext();
          await ac.resume();
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
            },
          });
          an = ac.createAnalyser();
          an.fftSize = 4096;
          ac.createMediaStreamSource(stream).connect(an);
          buf = new Float32Array(an.fftSize);
          const loop = () => {
            an.getFloatTimeDomainData(buf);
            cb(pitch(buf, ac.sampleRate));
            raf = requestAnimationFrame(loop);
          };
          loop();
          return true;
        } catch (e) {
          onErr(
            "Microphone access was blocked. Allow it in your browser settings and try again.",
          );
          return false;
        }
      }
      function stopMic() {
        cancelAnimationFrame(raf);
        if (stream) stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      function meter() {
        const w = h("div");
        w.innerHTML =
          '<svg class="meter" viewBox="0 0 300 170" role="img" aria-label="Tuning meter"><path d="M30 150A120 120 0 0 1 270 150" fill="none" stroke="#d3d9df" stroke-width="2"/><path d="M135 32A120 120 0 0 1 165 32" fill="none" stroke="#1f8f5f" stroke-width="6"/>' +
          [-50, -40, -30, -20, -10, 0, 10, 20, 30, 40, 50]
            .map(
              (v) =>
                '<line x1="150" y1="22" x2="150" y2="' +
                (v % 50 === 0 || v === 0 ? 12 : 16) +
                '" stroke="#5d6b7a" stroke-width="2" transform="rotate(' +
                v * 0.9 +
                ' 150 150)"/>',
            )
            .join("") +
          '<line id="nd" x1="150" y1="150" x2="150" y2="30" stroke="#16202b" stroke-width="3" stroke-linecap="round" style="transition:transform .12s"/><circle cx="150" cy="150" r="7" fill="#16202b"/></svg>';
        const nd = w.querySelector("#nd");
        let sm = 0;
        return {
          el: w.firstChild,
          set: (c) => {
            sm = sm * 0.7 + Math.max(-50, Math.min(50, c)) * 0.3;
            nd.setAttribute("transform", "rotate(" + sm * 0.9 + " 150 150)");
          },
        };
      }
      function readout() {
        const n = h("div", { class: "note mono" }, "--"),
          f = h("div", { class: "hz mono" }, "0.0 Hz"),
          s = h("div", { class: "status" }, "Waiting for sound");
        return {
          el: h("div", { class: "read" }, [n, f, s]),
          show: (a, b, c, cl) => {
            n.textContent = a;
            f.textContent = b;
            s.textContent = c;
            s.className = "status " + (cl || "");
          },
        };
      }
      function inTuneText(c) {
        return Math.abs(c) < 5
          ? ["In tune", "ok"]
          : c < 0
            ? ["Too low: tune up", "bad"]
            : ["Too high: tune down", "bad"];
      }

      /* ============ 4. TUNER ============ */
      const PRE = {
        "Guitar, standard": ["E2", "A2", "D3", "G3", "B3", "E4"],
        "Guitar, drop D": ["D2", "A2", "D3", "G3", "B3", "E4"],
        "Guitar, half step down": ["D#2", "G#2", "C#3", "F#3", "A#3", "D#4"],
        "Bass, standard": ["E1", "A1", "D2", "G2"],
        Ukulele: ["G4", "C4", "E4", "A4"],
      };
      function tunerView() {
        let pre = Object.keys(PRE)[0],
          on = false;
        const M = meter(),
          R = readout(),

      const SH = (n, s) =>
        NN[

      };
      const tones = (c) => {
        const m = c.match(/^([A-G][#b]?)([^/]*)/);
        if (!m) return "";
        const r = NN.indexOf(SH(m[1], 0)),
          suffix = m[2];
        let intervals;
        if (/dim|°/.test(suffix))
          intervals = /7|°/.test(suffix) ? [0, 3, 6, 9] : [0, 3, 6];
        else if (/aug|\+/.test(suffix)) intervals = [0, 4, 8];
        else if (/sus2/.test(suffix)) intervals = [0, 2, 7];
        else if (/sus4/.test(suffix)) intervals = [0, 5, 7];
        else if (/maj7/.test(suffix)) intervals = [0, 4, 7, 11];
        else if (/m7/.test(suffix)) intervals = [0, 3, 7, 10];
        else if (/7/.test(suffix)) intervals = [0, 4, 7, 10];
        else if (/^m(?!aj)/.test(suffix)) intervals = [0, 3, 7];
        else intervals = [0, 4, 7];
        const steps = /sus2/.test(suffix)
          ? [0, 1, 4]
          : /sus4/.test(suffix)
            ? [0, 3, 4]
            : intervals.length === 4
              ? [0, 2, 4, 6]

          const letter = letters[(rootStep + steps[index]) % 7],
            target = (r + interval) % 12,

      function chordDiagram(chord) {
        const x0 = 38,
          y0 = 48,
          dx = 25,
          dy = 31,
          grid = [];
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 230 225");
        svg.setAttribute("class", "chord-diagram");
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", chord.name + " guitar chord fingering diagram");
        const add = (tag, attrs, text) => {
          const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
          for (const key in attrs) el.setAttribute(key, attrs[key]);
          if (text) el.textContent = text;
          grid.push(el);
        };
        for (let string = 0; string < 6; string++)
          add("line", {
              x1: x0 + string * dx,
              y1: y0,
              x2: x0 + string * dx,
              y2: y0 + 5 * dy,
              stroke: "currentColor",
              "stroke-width": "2",
            });
        for (let fret = 0; fret <= 5; fret++)
          add("line", {
              x1: x0,
              y1: y0 + fret * dy,
              x2: x0 + 5 * dx,
              y2: y0 + fret * dy,
              stroke: "currentColor",
              "stroke-width": fret === 0 ? "5" : "2",
            });
        chord.frets.forEach((fret, string) => {
          const x = x0 + string * dx;
          if (fret === "x" || fret === 0) {
            add(
              "text",
              {
                  x,
                  y: 29,
                  "text-anchor": "middle",
                  class: "diagram-mark",
                },
              fret === 0 ? "○" : "×",
            );
          } else {
            const y = y0 + (fret - 0.5) * dy;
            add("circle", { cx: x, cy: y, r: 10, class: "diagram-dot" });
            add(
              "text",
              {
                  x,
                  y: y + 4,
                  "text-anchor": "middle",
                  class: "diagram-finger",
                },
              chord.fingers[string] || "",
            );
          }
        });
        svg.append(...grid);
        return svg;
      }

      function parseSongBody(body) {
        const rows = [];
        const lines = (body || "").split(/\r?\n/);
        let pending = [];
        for (const raw of lines) {
          const line = raw.trimEnd();
          if (!line.trim()) {
            if (pending.length) {
              rows.push({ type: "chords", chords: pending.slice() });
              pending = [];
            }
            continue;
          }
          if (/^(verse|chorus|pre-chorus|bridge|intro|outro|hook|tag)\b/i.test(line)) {
            if (pending.length) {
              rows.push({ type: "chords", chords: pending.slice() });
              pending = [];
            }
            rows.push({ type: "section", text: line });
            continue;
          }
          const chordLine = /^\s*(?:\[[^\]]+\]\s*)+$/.test(line);
          if (chordLine) {
            pending = [...line.matchAll(/\[([^\]]+)\]/g)].map((m) => m[1]);
            continue;
          }
          const matches = [...line.matchAll(/\[([^\]]+)\]/g)];
          if (pending.length) {
            rows.push({
              type: "lyric",
              text: line.replace(/\[[^\]]+\]/g, "").replace(/\s+/g, " ").trim(),
              chords: pending.slice(),
            });
            pending = [];
            continue;
          }
          if (matches.length) {
            const groups = [];
            let carrying = null;
            for (const piece of line.split(/(\[[^\]]+\])/).filter(Boolean)) {
              if (/^\[[^\]]+\]$/.test(piece)) {
                if (carrying) groups.push(carrying);
                carrying = { chord: piece.slice(1, -1), text: "" };
              } else {
                const text = piece.trim();
                if (!text) continue;
                if (carrying) {
                  carrying.text = (carrying.text + " " + text).trim();
                } else {
                  groups.push({ chord: null, text });
                }
              }
            }
            if (carrying) groups.push(carrying);
            rows.push({ type: "lyric-inline", groups });
            continue;
          }
          rows.push({ type: "lyric", text: line, chords: [] });
        }
        if (pending.length) rows.push({ type: "chords", chords: pending.slice() });
        return rows;
      }

                h("h2", {}, "Chord library"),
                h("p", { class: "sub" }, "Explore guitar shapes, chord tones, and finger positions."),
              ]),
              chordSearch,
            ]),
            categoryList,
            h("div", { class: "chord-library-layout" }, [
              detail,
              h("aside", { class: "chord-more" }, [
                h("h3", {}, "Chords"),
                chordList,
              ]),
            ]),
          ]),
        );
        return page(
          "Chord library",
          "Browse chords by quality and search their notes or fingering tips.",
          box,
        );
      }

      /* ============ 7. METRONOME ============ */
      function metroView() {
        let bpm = 100,
          sig = 4,
          beat = 0,
          next = 0,
          timer = null,
          taps = [],
          acc = true;
        const bi = h("input", {
            type: "number",
            min: "30",
            max: "300",
            value: bpm,
            "aria-label": "BPM",
          }),
          dots = h("div", { class: "beats" }),
          btn = h("button", { class: "btn" }, "Start");
        const drawDots = (a) =>
          dots.replaceChildren(
            ...[...Array(sig)].map((_, i) =>
              h("span", { class: i === a ? "on" : "" }),
            ),
          );
        drawDots(-1);
        const click = (t, hi) => {
          const o = ac.createOscillator(),
            g = ac.createGain();
          o.frequency.value = hi && acc ? 1600 : 1000;
          g.gain.setValueAtTime(0.4, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          o.connect(g).connect(ac.destination);
          o.start(t);
          o.stop(t + 0.07);
        };
        const stop = () => {
          clearInterval(timer);
          timer = null;
          btn.textContent = "Start";
          drawDots(-1);
        };
        cleanup = stop;
        const start = () => {
          ac = ac || new AudioContext();
          ac.resume();
          beat = 0;
          next = ac.currentTime + 0.05;
          btn.textContent = "Stop";
          timer = setInterval(() => {
            while (next < ac.currentTime + 0.12) {
              const b = beat % sig;
              click(next, b === 0);
              setTimeout(
                () => drawDots(b),
                Math.max(0, (next - ac.currentTime) * 1000),
              );
              next += 60 / bpm;
              beat++;
            }
          }, 25);
        };
        btn.onclick = () => (timer ? stop() : start());
        const setB = (v) => {
          bpm = Math.max(30, Math.min(300, Math.round(v) || 100));
          bi.value = bpm;
        };
        bi.onchange = () => setB(bi.value);
        const ts = h(
          "select",
          {
            "aria-label": "Time signature",
            onchange: (e) => {
              sig = +e.target.value;
              drawDots(-1);
            },
          },
          [
            ["2", "2/4"],
            ["3", "3/4"],
            ["4", "4/4"],
            ["6", "6/8"],
          ].map(([v, l]) => {
            const o = h("option", { value: v }, l);
            if (v === "4") o.selected = true;
            return o;
          }),
        );
        const tap = h(
          "button",
          {
            class: "btn g",
            onclick: () => {
              const n = performance.now();
              taps = taps.filter((t) => n - t < 2500);
              taps.push(n);
              if (taps.length > 1)
                setB(
                  60000 /
                    ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)),
                );
            },
          },
          "Tap tempo",
        );
        const ck = h("input", {
          type: "checkbox",
          checked: "",
          style: "width:auto",
          onchange: (e) => (acc = e.target.checked),
        });
        return page(
          "Metronome",
          "Steady time with an accented first beat.",
          h("div", { class: "card", style: "max-width:520px" }, [
            dots,
            h("div", { class: "row" }, [
              h("div", { class: "grow" }, field("BPM", bi)),
              h("div", { class: "grow" }, field("Time signature", ts)),
            ]),
            h("label", { style: "display:flex;gap:.5rem;align-items:center" }, [
              ck,
              "Accent the first beat",
            ]),
            h("div", { class: "row", style: "margin-top:1rem" }, [btn, tap]),
          ]),
        );
      }

      /* ============ 8. SETLIST ============ */
      function setlistView() {
        const box = h("div"),
          items = allSongs().filter((s) => S.favs.has(s.id));
        const open = (s) =>
          box.replaceChildren(songDetail(s, () => shell.go("setlist")));
        box.append(
          h(
            "div",
            { class: "card" },
            h(
              "div",
              { class: "list" },
              items.length
                ? items.map((s, i) =>
                    h("div", {}, [
                      h("div", {}, [
                        h("b", {}, i + 1 + ". " + s.title),
                        h("div", { class: "sub" }, s.artist || ""),
                      ]),
                      h(
                        "button",
                        { class: "btn g sm", onclick: () => open(s) },
                        "Open",
                      ),
                    ]),
                  )
                : [
                    h(
                      "p",
                      { class: "sub" },
                      "Your setlist is empty. Open a song in Song List or a song detail and choose Add to setlist.",
                    ),
                  ],
            ),
          ),
        );
        return page(
          "Setlist",
          "Songs you saved for your next practice or gig.",
          box,
        );
      }

      /* ============ 10. MY SONGS (full CRUD) ============ */
      function songsView(edit) {
        const box = h("div"),
          search = h("input", {
            type: "search",
            maxlength: "80",
            placeholder: "Search titles or artists",
            "aria-label": "Search songs by title or artist",
          }),
          filter = h("select", { "aria-label": "Filter song list" }, [
            h("option", { value: "all" }, "All songs"),
            h("option", { value: "mine" }, "My songs"),
            h("option", { value: "library" }, "Songbook"),
          ]),
          results = h("div", { class: "song-card-grid" });
        const renderEditor = (song) => {
          const title = h("input", { maxlength: "80", value: song?.title || "" }),
            artist = h("input", { maxlength: "80", value: song?.artist || "" }),
            body = h("textarea", {
              maxlength: "5000",
              "aria-label": "Song lyrics and chords",
              placeholder: "[Am]Place a chord [G]right before [C]the word",
            }, song?.body || ""),
            preview = h("div", { class: "card sheet song-preview" });
          const updatePreview = () =>
            preview.replaceChildren(...renderedSongRows(body.value, 0, false));
          body.oninput = updatePreview;
          updatePreview();
          box.replaceChildren(h("div", { class: "card song-editor" }, [
            h("div", { class: "row song-editor-heading" }, [
              h("h2", {}, song ? "Edit song" : "Add a song"),
              h("button", { class: "btn g", onclick: draw }, "Back to Song List"),
            ]),
            field("Title", title),
            field("Artist", artist),
            field("Lyrics & chords", body),
            h("p", { class: "sub", style: "margin-top:.4rem" },
              "Put each chord in brackets immediately before the word or syllable where it changes. Chord-only lines above a lyric line are also supported."),
            h("b", { class: "song-preview-label" }, "Live preview"),
            preview,
            h("div", { class: "row", style: "margin-top:1rem" }, [
              h("button", {
                class: "btn",
                onclick: async (e) => {
                  const row = {
                    title: title.value.trim(),
                    artist: artist.value.trim() || null,
                    body: body.value,
                  };
                  if (!row.title) return toast("Add a title.", 1);
                  if (!row.body.trim()) return toast("Add lyrics and chords.", 1);
                  const button = e.currentTarget;
                  button.disabled = true;
                  try {
                    const r = song
                      ? await sb.from("songs").update(row).eq("id", song.id).select().single()
                      : await sb.from("songs").insert({ ...row, user_id: S.u.id }).select().single();
                    if (fail(r.error)) return;
                    S.songs = song
                      ? S.songs.map((item) => item.id === song.id ? r.data : item)
                      : [r.data, ...S.songs];
                    toast("Song saved.");
                    draw();
                  } catch (error) {
                    console.error("BandMate song save failed:", error);
                    toast("Could not save this song. Please try again.", 1);
                  } finally {
                    button.disabled = false;
                  }
                },
              }, "Save song"),
            ]),
          ]));
        };
        const openSong = (song) => {
          box.replaceChildren(
            h("div", { class: "song-detail-heading" }, [
              h("button", { class: "btn g", onclick: draw }, "Back to Song List"),
              song.mine && h("button", {
                class: "btn",
                onclick: () => renderEditor(song),
              }, "Edit song"),
            ]),
            songDetail(song, draw, false),
          );
        };
        const draw = () => {
          const term = search.value.trim().toLowerCase(),
            mode = filter.value,
            matches = allSongs().filter((song) => {
              const isMine = Boolean(song.mine);
              return (mode === "all" || (mode === "mine" && isMine) || (mode === "library" && !isMine)) &&
                (song.title + " " + (song.artist || "")).toLowerCase().includes(term);
            });
          results.replaceChildren(...(matches.length
            ? matches.map((song) => h("article", { class: "card song-card" }, [
              h("div", { class: "song-card-icon", "aria-hidden": "true" }, "♫"),
              h("div", { class: "song-card-info" }, [
                h("span", { class: "theory-level-tag" }, song.mine ? "My song" : "Songbook"),
                h("h2", {}, song.title),
                h("p", { class: "sub" }, song.artist || "Unknown artist"),
              ]),
              h("div", { class: "row song-card-actions" }, [
                h("button", { class: "btn g sm", onclick: () => openSong(song) }, "View"),
                song.mine && h("button", {
                  class: "btn g sm",
                  onclick: () => renderEditor(song),
                }, "Edit"),
                song.mine && h("button", {
                  class: "btn g sm",
                  onclick: async () => {
                    if (!confirm('Delete "' + song.title + '"?')) return;
                    const r = await sb.from("songs").delete().eq("id", song.id);
                    if (fail(r.error)) return;
                    S.songs = S.songs.filter((item) => item.id !== song.id);
                    S.favs.delete("u:" + song.id);
                    draw();
                    toast("Song deleted.");
                  },
                }, "Delete"),
              ]),
            ]))
            : [h("div", { class: "card song-empty" }, [
              h("b", {}, "No songs found"),
              h("p", { class: "sub" }, "Try a different search or add your own song."),
            ])]));
          box.replaceChildren(
            h("div", { class: "card song-tools" }, [
              h("div", { class: "song-search" }, [
                h("label", {}, "Find a song"),
                search,
              ]),
              h("div", { class: "song-filter" }, [
                h("label", {}, "Show"),
                filter,
              ]),
              h("button", { class: "btn", onclick: () => renderEditor(null) }, "Add song"),
            ]),
            results,
          );
        };
        search.oninput = draw;
        filter.onchange = draw;
        draw();
        return page(
          "Song List",
          "Search, view, and manage your songbook and personal chord sheets.",
          box,
        );
      }

      /* ============ 2. PROFILE + ACCOUNT ============ */
      function profileView() {
        const n = h("input", {
            maxlength: "40",
            value: S.p.display_name || "",
          }),
          i = h(
            "select",
            {},
            opts(
              ["guitar", "bass", "ukulele", "piano", "drums", "voice", "other"],
              S.p.instrument,
            ),
          ),
          l = h(
            "select",
            {},
            opts(["beginner", "intermediate", "advanced"], S.p.level),
          ),
          pw = h("input", {
            type: "password",
            autocomplete: "new-password",
            maxlength: "72",
          });
        return page(
          "Profile",
          "Your details and account security.",
          h(
            "div",
            { class: "card", style: "max-width:520px;margin-bottom:1.25rem" },
            [
              h("b", {}, "Details"),
              field("Display name", n),
              field("Main instrument", i),
              field("Skill level", l),
              h(
                "button",
                {
                  class: "btn",
                  style: "margin-top:1rem",
                  onclick: async () => {
                    const v = n.value.trim();
                    if (!v) return toast("Add a display name.", 1);
                    const r = await sb.from("profiles").upsert({
                      id: S.u.id,
                      display_name: v,

                      instrument: i.value,
                      level: l.value,
                    });
                    if (fail(r.error)) return;
                    S.p = {
                      display_name: v,
                      instrument: i.value,
                      level: l.value,
                    };
                    toast("Profile saved.");
                  },
                },
                "Save profile",
              ),
            ],
          ),
          h("div", { class: "card", style: "max-width:520px" }, [
            h("b", {}, "Account"),
            h("p", { class: "sub" }, S.u.email),
            field("New password (at least 10 characters)", pw),
            h("div", { class: "row", style: "margin-top:1rem" }, [
              h(
                "button",
                {
                  class: "btn",
                  onclick: async () => {
                    if (pw.value.length < 10)
                      return toast("Use at least 10 characters.", 1);
                    if (
                      fail(
                        (await sb.auth.updateUser({ password: pw.value }))
                          .error,
                      )
                    )
                      return;
                    pw.value = "";
                    toast("Password updated.");
                  },
                },
                "Change password",
              ),
              h(
                "button",
                { class: "btn g", onclick: () => sb.auth.signOut() },
                "Log out",
              ),
            ]),
          ]),
        );
      }

      /* ============ 1. BOOT ============ */
      async function handleSession(session) {
        if (!session) {
          cleanup();
          S.u = null;
          S.prog = new Set();
          S.logs = [];
          S.songs = [];
          S.favs = new Set();
          authView();
          return;
        }

        const userId = session.user.id;
        if (S.u?.id === userId) {
          S.u = session.user;
          return;
        }

        S.u = session.user;

        try {
          await load();
        } catch (error) {
          console.error("BandMate data load failed:", error);
        }

        if (S.u?.id === userId) shell();
      }

      if (!configured) {
        authView();
      } else {
        // Ipakita agad ang login habang chine-check ang session.
        authView();

        sb.auth.onAuthStateChange((event, session) => {
          if (event === "TOKEN_REFRESHED") return;

          // Patakbuhin pagkatapos makabalik ang Supabase auth callback.
          setTimeout(() => {
            void handleSession(session);
          }, 0);
        });
      }
    </script>
  </body>
</html>
